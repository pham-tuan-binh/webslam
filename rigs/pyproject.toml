[project]
name = "wslam-rigs"
version = "0.1.0"
description = "Ground-truth rigs for web-slam: turntable, strobe, ChArUco."
requires-python = ">=3.10"
dependencies = []

# Everything real is optional, so the dry-run paths — which are what CI
# exercises — install with no dependencies at all.
[project.optional-dependencies]
serial = ["pyserial>=3.5"]
vision = ["opencv-python>=4.10", "numpy>=1.26"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["capture", "charuco", "strobe"]
